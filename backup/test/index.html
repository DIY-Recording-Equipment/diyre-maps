<body>
  <div class="header container">
    <div class="logo"><img src="../styles/img/logo.png" /></div>
  </div>

  <div class="container title text-center">
    <div><img height="48" src="../styles/img/IBMicon.png"
        width="60" /></div>

    <h3>OLA5 Interactive Build Map</h3>
  </div>

  <div class="container" id="all">
    <div class="row">
      <div class="col-sm-4" id="left">
        <div id="list">
          <!-- list -->
        </div>
        <!-- <canvas id="canvas" style="border:2px solid black;" width="200" height="200"> -->
        <!-- </canvas> -->
      </div>

      <div class="col-sm-8" id="right">
        <div id="svgContainer">
          <!-- svg -->
        </div>

        <div id="controls">
          <!-- controls -->
          <div id="myProgress">
            <div id="myBar"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    var buildGuide;
    var svg = Snap("#svgContainer");
    var bookmark = null;

    // svg.attr("display", "none");
    //svg.attr("opacity", "0");

    Snap.load("svg/OLA5 IBM Final V2.svg", function (f) {
      svg.append(f);
      var kit = svg.select("#KIT");
      kit.attr("opacity", "0");
      //console.log("test");
      $.getJSON("lib/OLA5-buildguide-data-190319.json", function (json) {
        //console.log(json.length);

        for (com in json.coms) {
          console.log("#" + com);
          elem = svg.select("#" + com);
          //console.log(elem + " -- " + com);

          for (att in json.coms[com]) {
            // console.log(json.coms[com]);
            // console.log(jso/\n.coms[com][att]);
            // console.log(att);
            var temp = elem.attr(att, json.coms[com][att]);
            // console.log(temp);
          }
        }
        main(json.steps);
      });
    });



    function main(steps) {
      $(function () {
        $("#list").accordion({
          active: false,
          collapsible: true,
          heightStyle: "content"
        });
        $(".step" + bookmark).click();
      });

      //check for saveData in local storage. If it isn't null pass it in.

      // localStorage.test = "hello123";

      if(localStorage.saveData) {

      buildGuide = new BuildGuide(svg, steps, true);
      } else {
      buildGuide = new BuildGuide(svg, steps);
      }



    };
  </script>

  <div class="container text-center">
    <div class="footer copyright">

  </div>
