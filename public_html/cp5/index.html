 <body>
    <div class="header container">
        <div class="logo"><img src="https://cdn.shopify.com/s/files/1/0698/2265/t/28/assets/logo.png?827293068455235108"></div>
    </div>  
    <div class="container title text-center">
        <div><img src="https://cdn.shopify.com/s/files/1/0698/2265/files/IBMicon.png?10596201697740015471" width="60" height="48"></div>
        <h3>CP5 Interactive Build Map</h3>
    </div> 
    <div id="all" class="container">
      <div class="row">
        <div id ="left" class="col-sm-4">

          <div id="list">
            <!-- list -->

          </div>

        </div>
        <div id="right" class="col-sm-8">
          <div id="svgContainer">

            <!-- svg -->
          </div>
          <div id="controls">
            <!-- controls -->
            <div id="myProgress">
              <div id="myBar"></div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <script>
      var buildGuide;
      var svg = Snap("#svgContainer");
      var bookmark = null;

      // svg.attr("display", "none");
      //svg.attr("opacity", "0");

      Snap.load("https://cdn.shopify.com/s/files/1/0698/2265/files/CP57.svg?7991681825506975598", function(f){
        svg.append(f);
        var kit  = svg.select("#KIT");
        kit.attr("opacity", "0");
        // console.log("test");
        $.getJSON("lib/cp5-buildguide-data.json", function(json){
          // console.log(json.length);

          for(com in json.coms){
            elem = svg.select("#"+com);
            //  console.log(elem);
            for(att in json.coms[com]){
              //  console.log(json.coms[com]);
              // console.log(json.coms[com][att]);
              // console.log(att);
              var temp = elem.attr(att, json.coms[com][att]);
              //  console.log(temp);
            }
          }
          main(json.steps);
        });
       });



      function main(steps) {
        $( function() {
          $( "#list" ).accordion({
          active: false,
          collapsible: true,
          heightStyle: "content"
      });
          $(".step" + bookmark).click();
      } );


        buildGuide = new BuildGuide(svg, steps);




      };


    </script>
