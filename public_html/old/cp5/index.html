<div id="all" class="container">
  <div class="row">
    <div id="left" class="col-sm-4">
      <div id="list">
        <!-- list -->
      </div>
    </div>
    <div id="right" class="col-sm-8">
      <div id="svgContainer">
        <!-- svg -->
      </div>
      <div id="controls">
        <!-- controls -->
        <div id="myProgress">
          <div id="myBar"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  var buildGuide;
  var svg = Snap("#svgContainer");
  var bookmark = null;

  // svg.attr("display", "none");
  //svg.attr("opacity", "0");

  Snap.load("/assets/CP5.svg", function(f) {
    svg.append(f);
    var kit = svg.select("#KIT");
    kit.attr("opacity", "0");

    $.getJSON("/js/CP5.json", function(json) {
      console.log(json.steps);

      for (com in json.coms) {
        elem = svg.select("#" + com);
        // console.log(elem);
        // console.log("#" + com);
        for (att in json.coms[com]) {
          // console.log(json.coms[com]);
          // console.log(json.coms[com][att]);
          // console.log(att);
          var temp = elem.attr(att, json.coms[com][att]);
          // console.log(temp);
        }
      }
      $(function() {
        $("#list").accordion({
          active: false,
          collapsible: true,
          heightStyle: "content"
        });
        $(".step" + bookmark).click();
      });

      buildGuide = new BuildGuide(svg, json.steps);
    });
  });
</script>
