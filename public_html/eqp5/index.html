    <div class="header container">

    <div class="container title text-center">
        <div><img src="../styles/img/IBMicon.png" width="60" height="48"></div>
        <h3>EQP5 Interactive Build Map</h3>
    </div> 
    <div id="all" class="container">
      <div class="row">
        <div id ="left" class="col-sm-4">

          <div id="list">
            <!-- list -->

          </div>

          <!-- <canvas id="canvas" style="border:2px solid black;" width="200" height="200"> -->
          <!-- </canvas> -->

        </div>
        <div id="right" class="col-sm-8">
          <div id="svgContainer">

            <!-- svg -->
          </div>
          <div id="controls">
            <!-- controls -->
            <div id="myProgress">
              <div id="myBar"></div>
            </div>
          </div>

        </div>
      </div>

    <script>
      var buildGuide;
      var svg = Snap("#svgContainer");
      var bookmark = null;

      // svg.attr("display", "none");
      //svg.attr("opacity", "0");

      Snap.load("svg/EQP5 IBG Final.svg", function(f){
        svg.append(f);
        var kit  = svg.select("#KIT");
        kit.attr("opacity", "0");
        //console.log("test");
        $.getJSON("lib/EQP5-buildguide-data.json",function(json){
          //console.log(json.length);

          for(com in json.coms){
            elem = svg.select("#"+com);
            // console.log(elem);
            // console.log("#" + com);
            for(att in json.coms[com]){
              // console.log(json.coms[com]);
              // console.log(json.coms[com][att]);
              // console.log(att);
              var temp = elem.attr(att, json.coms[com][att]);
//               console.log(temp);
            }
          }
          main(json.steps);
        });
       });



      function main(steps) {
        $( function() {
          $( "#list" ).accordion({
          active: false,
          collapsible: true,
          heightStyle: "content"
      });
          $(".step" + bookmark).click();
      } );


        buildGuide = new BuildGuide(svg, steps);




      };


    </script>
