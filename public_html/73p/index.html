<h3>73P Interactive Build Map</h3>
<div>
    <p>This map is for the 73P version 1.0. If you have version 1.1 (August 2025 and after), see the <a href="../73p2/">73P 1.1 Build Map</a>. </p>
</div>
</div>

<div class="container" id="all">
<div class="row">
<div class="col-sm-4" id="left">
<div id="list"><!-- list --></div>
<!-- <canvas id="canvas" style="border:2px solid black;" width="200" height="200"> --><!-- </canvas> --></div>

<div class="col-sm-8" id="right">
<div id="svgContainer"><!-- svg --></div>

<div id="controls"><!-- controls -->
<div id="myProgress">
<div id="myBar"></div>
</div>
</div>
</div>
</div>
</div>
<script>
      var buildGuide;
      var svg = Snap("#svgContainer");
      var bookmark = null;

      // svg.attr("display", "none");
      //svg.attr("opacity", "0");

      Snap.load("svg/73p-ibm8.svg", function(f){
        svg.append(f);
        var kit  = svg.select("#KIT");
        kit.attr("opacity", "0");
        //console.log("test");
        $.getJSON("lib/data.json",function(json){
          //console.log(json.length);

          for(com in json.coms){
            console.log("#" + com);
            elem = svg.select("#"+com);
            //console.log(elem + " -- " + com);
            
            for(att in json.coms[com]){
              // console.log(json.coms[com]);
              // console.log(jso/\n.coms[com][att]);
              // console.log(att);
              var temp = elem.attr(att, json.coms[com][att]);
              // console.log(temp);
            }
          }
          main(json.steps);
        });
       });



      function main(steps) {
        $( function() {
          $( "#list" ).accordion({
          active: false,
          collapsible: true,
          heightStyle: "content"
      });
          $(".step" + bookmark).click();
      } );


        buildGuide = new BuildGuide(svg, steps);




      };


    </script>
